name: Bug report
description: Report a reproducible problem without sharing private data.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach statements, screenshots, logs, traces, databases, exports, credentials, institution names, account suffixes, or raw API responses.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the behavior using synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproduction that contains no personal or financial data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, personal data, financial records, private paths, and identifying metadata.
          required: true
